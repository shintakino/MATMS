# Coolify Service template. The release tooling substitutes the image tag before upload.
services:
  postgres:
    image: matms-postgres:MATMS_RELEASE_TAG
    pull_policy: never
    environment:
      POSTGRES_DB: matms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MATMS_APP_DB_PASSWORD: ${MATMS_APP_DB_PASSWORD}
    volumes:
      - matms_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d matms']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  predeploy-backup:
    image: matms-postgres:MATMS_RELEASE_TAG
    pull_policy: never
    exclude_from_hc: true
    user: postgres
    entrypoint: [/usr/local/bin/matms-backup.sh]
    command: [once]
    environment:
      PGHOST: postgres
      PGDATABASE: matms
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      MATMS_BACKUP_KEY: ${MATMS_BACKUP_KEY}
    volumes:
      - matms_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  migrate:
    image: matms-server:MATMS_RELEASE_TAG
    pull_policy: never
    exclude_from_hc: true
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/matms
    command: [/bin/sh, /app/deploy/migrate.sh]
    depends_on:
      postgres:
        condition: service_healthy
      predeploy-backup:
        condition: service_completed_successfully
    restart: 'no'
  server:
    image: matms-server:MATMS_RELEASE_TAG
    pull_policy: never
    init: true
    environment:
      NODE_ENV: production
      PORT: '3000'
      MATMS_BIND_HOST: 0.0.0.0
      DATABASE_URL: postgresql://matms_app:${MATMS_APP_DB_PASSWORD}@postgres:5432/matms
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${MATMS_ORIGIN}
      CORS_ORIGIN: ${MATMS_ORIGIN}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, bun, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    image: matms-web:MATMS_RELEASE_TAG
    pull_policy: never
    init: true
    environment:
      NODE_ENV: production
      SERVER_URL: http://server:3000
      MATMS_CANONICAL_ORIGIN: ${MATMS_ORIGIN}
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  tunnel:
    image: cloudflare/cloudflared:2026.10.3
    exclude_from_hc: true
    command: [tunnel, --no-autoupdate, run, --url, 'http://web:3001']
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
  backup:
    image: matms-postgres:MATMS_RELEASE_TAG
    pull_policy: never
    user: postgres
    entrypoint: [/usr/local/bin/matms-backup.sh]
    environment:
      PGHOST: postgres
      PGDATABASE: matms
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      MATMS_BACKUP_KEY: ${MATMS_BACKUP_KEY}
    volumes:
      - matms_backups:/backups
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "find /backups -name '*.dump.enc' -mmin -1500 -print -quit | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
volumes:
  matms_data:
  matms_backups:
